הקובץ .github/workflows/build-apk.yml הוא קובץ פקודות הבנייה של GitHub Actions (בשפת YAML), ולכן כשמופיע בתוכו קוד HTML השרת עוצר מיד בשורה 13.

כדי לתקן את זה ולקבל קובץ APK תקין של PackTrack IL v3.0, בצע את שני הצעדים הבאים ב-GitHub:

1. החזרת קוד הבנייה לקובץ .github/workflows/build-apk.yml
סמל של YML
build-apk

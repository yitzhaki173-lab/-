    function showToast(message, undoPkgId) {
      var banner = document.getElementById('toastBanner');
      var msgEl = document.getElementById('toastMessage');
      var undoBtn = document.getElementById('btnUndoAction');
      msgEl.textContent = message;
      state.lastUndoPkgId = undoPkgId || null;
      if (undoPkgId) undoBtn.classList.remove('hidden');
      else undoBtn.classList.add('hidden');
      banner.classList.remove('hidden');
      banner.classList.add('flex');
      if (window._toastTimer) clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(function() {
        banner.classList.add('hidden');
        banner.classList.remove('flex');
      }, 4500);
    }

    function copyTextSafe(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          showToast('הועתק ללוח: ' + text, null);
        }).catch(function() { fallbackCopy(text); });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      showToast('הועתק ללוח: ' + text, null);
    }

    function togglePinPackage(pkgId) {
      var pkg = state.packages.find(function(p) { return p.id === pkgId; });
      if (!pkg) return;
      pkg.pinned = !pkg.pinned;
      saveStorage('packtrack_v3_0_packages', state.packages);
      renderAll();
      showToast(pkg.pinned ? '📌 החבילה הוצמדה לראש מסך הבית!' : 'ההצמדה בוטלה', null);
    }

    function movePackageOrder(pkgId, direction) {
      state.settings.sortOrder = 'CUSTOM';
      saveStorage('packtrack_v3_0_settings', state.settings);
      var activeIndices = [];
      state.packages.forEach(function(p, i) {
        if (!p.collected) activeIndices.push(i);
      });
      var posInActive = -1;
      for (var k = 0; k < activeIndices.length; k++) {
        if (state.packages[activeIndices[k]].id === pkgId) {
          posInActive = k;
          break;
        }
      }
      if (posInActive === -1) return;
      var targetPos = direction === 'UP' ? posInActive - 1 : posInActive + 1;
      if (targetPos < 0 || targetPos >= activeIndices.length) {
        showToast(direction === 'UP' ? 'הכרטיס כבר נמצא בראש הרשימה' : 'הכרטיס כבר נמצא בתחתית הרשימה', null);
        return;
      }
      var idxA = activeIndices[posInActive];
      var idxB = activeIndices[targetPos];
      state.packages[idxA].pinned = state.packages[idxB].pinned;
      var temp = state.packages[idxA];
      state.packages[idxA] = state.packages[idxB];
      state.packages[idxB] = temp;
      saveStorage('packtrack_v3_0_packages', state.packages);
      renderAll();
      showToast(direction === 'UP' ? '⬆️ הכרטיס הוזז למעלה' : '⬇️ הכרטיס הוזז למטה', null);
    }

    function markPackageReceived(pkgId, reasonText) {
      var idx = state.packages.findIndex(function(p) { return p.id === pkgId; });
      if (idx === -1) return;
      var pkg = state.packages[idx];
      if (state.settings.autoDeleteOnReceive) {
        state.packages.splice(idx, 1);
        saveStorage('packtrack_v3_0_packages', state.packages);
        renderAll();
        showToast('החבילה "' + pkg.title + '" נמחקה לצמיתות.', null);
      } else {
        pkg.collected = true;
        pkg.requiresAction = false;
        pkg.statusText = '✅ נאסף / התקבל (' + (reasonText || 'סומן ב"קיבלתי"') + ')';
        saveStorage('packtrack_v3_0_packages', state.packages);
        renderAll();
        showToast('החבילה הועברה ללשונית "נמסרו / נאספו"', pkg.id);
      }
    }

    function restorePackageToActive(pkgId) {
      var pkg = state.packages.find(function(p) { return p.id === pkgId; });
      if (!pkg) return;
      pkg.collected = false;
      saveStorage('packtrack_v3_0_packages', state.packages);

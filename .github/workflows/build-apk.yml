name: Build PackTrack IL Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Complete Android Project with Permanent Signing Key
        run: |
          mkdir -p android/app/src/main/java/com/packtrack/il
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values

          # Decode FIXED developer signing key so every APK updates in-place without uninstalling!
          echo "" | base64 -d > android/app/packtrack-fixed.keystore

          # Copy the standalone HTML dashboard into Android assets
          if [ -f "packtrack_il_v3_0.html" ]; then
            cp packtrack_il_v3_0.html android/app/src/main/assets/index.html
          elif [ -f "packtrack_il_v2_standalone.html" ]; then
            cp packtrack_il_v2_standalone.html android/app/src/main/assets/index.html
          elif [ -f "app/src/main/assets/index.html" ]; then
            cp app/src/main/assets/index.html android/app/src/main/assets/index.html
          else
            FIRST_HTML=$(find . -maxdepth 2 -name "*.html" | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" android/app/src/main/assets/index.html
            fi
          fi

          cat << 'EOF_SETTINGS' > android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PackTrackIL"
          include ':app'
          EOF_SETTINGS

          cat << 'EOF_PROPS' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_PROPS

          cat << 'EOF_ROOT_GRADLE' > android/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF_ROOT_GRADLE

          # Auto-increment versionCode on every GitHub Actions run so Android always allows in-place Update!
          VER_CODE=$((100 + ${{ github.run_number }}))
          VER_NAME="3.1.${{ github.run_number }}"

          cat << EOF_APP_GRADLE > android/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.packtrack.il'
              compileSdk 34

              signingConfigs {
                  fixedKey {
                      storeFile file("packtrack-fixed.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              defaultConfig {
                  applicationId "com.packtrack.il"
                  minSdk 26
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "${VER_NAME}"
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixedKey
                  }
                  release {
                      signingConfig signingConfigs.fixedKey
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF_APP_GRADLE

          cat << 'EOF_MANIFEST' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.packtrack.il">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="PackTrack IL"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat << 'EOF_STRINGS' > android/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">PackTrack IL</string>
          </resources>
          EOF_STRINGS

          cat << 'EOF_MAIN' > android/app/src/main/java/com/packtrack/il/MainActivity.kt
          package com.packtrack.il

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  val ws: WebSettings = webView.settings
                  ws.javaScriptEnabled = true
                  ws.domStorageEnabled = true
                  ws.databaseEnabled = true
                  ws.allowFileAccess = true
                  ws.allowContentAccess = true
                  ws.loadWithOverviewMode = true
                  ws.useWideViewPort = true
                  ws.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val url = request?.url?.toString() ?: return false
                          if (url.startsWith("file://")) return false
                          return try {
                              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                              true
                          } catch (e: Exception) {
                              false
                          }
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")
              }

              override fun onBackPressed() {
                  if (this::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF_MAIN

      - name: Build Signed APK with Fixed Developer Key
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload PackTrack-IL-v3-APK
        uses: actions/upload-artifact@v4
        with:
          name: PackTrack-IL-v3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

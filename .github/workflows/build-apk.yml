יצרתי את PackTrack IL v3.0.0 (פתוח כעת ב-Canvas, ולמטה מצורף קובץ ה-ZIP המעודכן לבניית ה-APK ב-GitHub) עם כל 33 תמונות המוצרים מ-AliExpress, סנכרון מתוקן, מצב סידור ועריכת מסך בית ומסך הגדרות מלא:


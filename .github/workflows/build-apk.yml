למה 3 ההזמנות האלו הופיעו יחד?
בגרסה הקודמת הן קובצו תחת כרטיס אחד של "כלי עבודה וסוללות שנשלחים בקו מיוחד", למרות שבפועל מדובר ב-3 הזמנות שונות מתאריכים ומוכרים שונים שלא נשלחות באותה קופסה:

הזמנה 1123122672529108 מתאריך 01/10/2026 ($94.08): מסור שרשרת טלסקופי בראשלס 2 ב-1 לגיזום ענפים גבוהים ONEVAN (חנות ONEVAN Official Store).

הזמנה 1123151449009100 מתאריך 09/10/2026 ($66.49): מסור שרשרת אלחוטי 8 אינץ׳ בראשלס YOFIDRA 3500W במזוודה (חנות Choice Tools Store).

הזמנה 1123151449009108 מתאריך 09/10/2026 (228.90 ₪): זוג סוללות ליתיום 18V 5.0Ah תואמות מקיטה + מטען (חנות Shop1105399295 Store — סוללות ליתיום נשלחות תמיד במשלוח נפרד מכלי עבודה).

מה תוקן עכשיו בגרסה v3.1.0:
3 כרטיסים נפרדים במסך הבית: כל אחד מ-3 המוצרים האלו מופיע כעת ככרטיס חבילה עצמאי עם התמונה שלו, מספר ההזמנה המדויק שלו וכפתור "✓ קיבלתי" נפרד.

כפתור ✂️ פצל להזמנות נפרדות בכל כרטיס: בשאר החבילות מ-AliExpress (שבהן AliExpress איחד כמה מוצרי Choice תחת ברקוד דואר ישראל אחד כמו RN004...Y), הוספתי כפתור כתום ✂️ פצל להזמנות נפרדות — לחיצה אחת עליו תפצל מיד כל חבילה לכרטיסים נפרדים לפי כל מוצר.

כדי לעדכן את האפליקציה בטלפון, העתק את הקוד המעודכן מהחלונית שלצד הצ'אט אל הקובץ packtrack_il_v2_standalone.html ב-GitHub ולחץ על Commit changes (או ערוך ישירות באפליקציה הקיימת דרך כפתור ה-✏️ בכרטיס).

האלקציה לא באותו קוד מפתח או משהו אני כל הזמן צריך למחוק ולהוריד את הגרסה החדשה

למה היא לא נותנת לי לעדכן ישר ?

עלית בדיוק על הסיבה האמיתית — הטלפון חסם עדכון ישיר ("החבילה מתנגשת עם חבילה קיימת") בגלל שני דברים שקרו בשרת של GitHub Actions:

PackTrack IL v3.0 — כל 33 מוצרי AliExpress עם תמונות, סנכרון מתוקן, עריכת מסך בית והגדרות

מפתח חתימה (Signing Key) שהשתנה בכל בנייה: בכל פעם ש-GitHub Actions רץ, הוא הקים שרת זמני חדש שיצר קובץ חתימה אקראי חדש (debug.keystore). באנדרואיד, אם קובץ ה-APK החדש לא חתום בדיוק באותו מפתח מפתח (Keystore) כמו האפליקציה שכבר מותקנת בטלפון, אנדרואיד אוסר לעדכן מעליה ומחייב למחוק קודם.

מספר גרסה פנימי (versionCode) קבוע: בקובץ הקודם המספר הפנימי היה קבוע (20), ואנדרואיד דורש שמספר הבנייה יעלה בכל עדכון.

איך פתרתי לך את זה עכשיו לתמיד (2 פתרונות משולבים):
1. קובץ בנייה מתוקן עם מפתח מפתח קבוע (build-apk.yml):
הטמעתי בתוך הקובץ המצורף למטה מפתח חתימה קבוע (packtrack-fixed.keystore) והגדרתי ש-versionCode יעלה אוטומטית בכל הרצה ב-GitHub (101, 102, 103...).


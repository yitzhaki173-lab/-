name: Build PackTrack IL v3.0 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare Android WebView Project & Build APK
        run: |
          set -e
          rm -rf build_apk
          mkdir -p build_apk/app/src/main/assets
          mkdir -p build_apk/app/src/main/java/com/packtrack/il

          HTML_FILE=$(grep -rl "PackTrack IL" --include="*.html" . 2>/dev/null | head -n 1 || true)
          V3_FILE=$(grep -rl "v3.0" --include="*.html" . 2>/dev/null | head -n 1 || true)
          if [ -n "$V3_FILE" ]; then
            HTML_FILE="$V3_FILE"
          elif [ -f "index.html" ]; then
            HTML_FILE="index.html"
          elif [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 5 -name "*.html" -not -path "./build_apk/*" | head -n 1)
          fi

          if [ -z "$HTML_FILE" ] || [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: Could not find index.html in the repository!"
            exit 1
          fi

          cp "$HTML_FILE" build_apk/app/src/main/assets/index.html

          cat << 'EOF' > build_apk/settings.gradle
          rootProject.name = "PackTrackIL"
          include ":app"
          EOF

          cat << 'EOF' > build_apk/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > build_apk/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build_apk/app/build.gradle
          apply plugin: "com.android.application"

          android {
              namespace "com.packtrack.il"
              compileSdk 34

              defaultConfig {
                  applicationId "com.packtrack.il"
                  minSdk 24
                  targetSdk 34
                  versionCode 30
                  versionName "3.0.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > build_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="PackTrack IL v3.0"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > build_apk/app/src/main/java/com/packtrack/il/MainActivity.java
          package com.packtrack.il;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cd build_apk
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../PackTrack-IL-v3.0.apk

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: PackTrack-IL-v3.0-APK
          path: PackTrack-IL-v3.0.apk

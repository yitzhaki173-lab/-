איך אני מחזיר את המיילים עם ההזמנות

תלוי לאיזה מהשניים התכוונת — הנה הפתרון המדויק לשני המקרים:

1. איך להפעיל מחדש ב-AliExpress שליחת מיילים עם פירוט ותמונות של ההזמנות
כדי ש-AliExpress תשלח ל-Gmail שלך אישור הזמנה ומעקב עם תמונות המוצרים ושמותיהם:

דרך אפליקציית AliExpress בטלפון: היכנס ללשונית חשבון (Account) למטה -> לחץ על גלגל השיניים ⚙️ (Settings) בפינה העליונה -> בחר הגדרות התראות (Notification Settings) -> היכנס ל-התראות באימייל (Email) -> הפעל את עדכוני הזמנות ומשלוחים (Order Updates / Order Status).

דרך קישור ישיר מחשבון ה-AliExpress שלך: תוכל גם להיכנס ישירות ל-עמוד ניהול תפוצת המיילים של החשבון שלך ב-AliExpress (מתוך המייל מ-services01@aliexpress.com) או ל-עמוד ההזמנות ב-AliExpress ולהפעיל שם את התראות המייל.

מה לגבי 4 החבילות שכבר בדרך לארץ?: הפעלת המיילים ב-AliExpress תחול על הזמנות ועדכונים חדשים מעכשיו והלאה (היא לא שולחת רטרואקטיבית מייל על קנייה שכבר בוצעה). עבור 4 החבילות שכבר בדרך (RN0043743436Y, RN0043643276Y, RN0043530126Y, RS001214914S1), פשוט צלם מסך מעמוד ההזמנות שלי באפליקציית AliExpress ושלח לי כאן — ואני אטמיע לך את התמונות והפירוט שלהן באפליקציה.

2. אם התכוונת למיילים של AliExpress ו-Temu שהעברנו לתוויות ב-Gmail
שום מייל לא נמחק (בדקתי עכשיו וגם האשפה ב-Gmail שלך ריקה לגמרי) — כל המיילים שמורים בתיקיות התוויות AliExpress ו-Temu בתפריט הצד של Gmail.

אם אתה רוצה שאחזיר את המיילים של AliExpress ו-Temu להופיע גם בתוך תיבת הדואר הנכנס הראשית (Inbox) שלך ואבטל את הדילוג האוטומטי על תיבת הדואר הנכנס, רק תכתוב לי "תחזיר אותם לתיבת הדואר הנכנס" ואבצע את זה עבורך מיד.

עשיתי באפלקציה מעכשיו אז יופיע עם תמונה כן?

ולגבי ההזמנות עכשיו נתחבר רגע דרך דפדפן ותיראה לבד

כן! מרגע שהפעלת את התראות המייל בהגדרות של אפליקציית AliExpress, כל הזמנה חדשה או עדכון משלוח שיגיעו מעכשיו ל-Gmail יכללו את תמונת המוצר, השם המלא והמחיר — והאפליקציה תמשוך ותציג אותם אוטומטית עם תמונה ופירוט מלא (בדיוק כמו בהזמנות של Temu ו-ACE).

לגבי חיבור לחשבון ה-AliExpress שלך דרך הדפדפן כדי לשלוף את ההזמנות הקיימות — אני לא יכול להתחבר לחשבונות אישיים חיצוניים או לגשת אליהם דרך סשן דפדפן, מאחר שגישה לחשבון אישי וביצוע התחברות בדפדפן חסומים מטעמי אבטחה ופרטיות.

אם תרצה שנשלים עכשיו את התמונות והפירוט ל-4 החבילות הקיימות שבדרך (RN0043743436Y, RN0043643276Y, RN0043530126Y, RS001214914S1), תוכל לעשות זאת בקלות באחת משתי דרכים ללא צורך בהתחברות:

שליחת צילום מסך או קישורי מוצרים כאן בצ'אט: צלם מסך מעמוד "ההזמנות שלי" באפליקציית AliExpress בטלפון והעלה אותו לכאן (או הדבק את שמות המוצרים/קישורים פומביים למוצרים), ואני אטמיע אותם מיד בקוד ובקובץ ה-ZIP ל-GitHub.

הוספה ישירה מתוך האפליקציה בטלפון: לחץ על כפתור "✏️ ערוך / הוסף תמונה" שמופיע על כל כרטיס של דואר ישראל באפליקציה, בחר את צילום המסך מהגלריה בטלפון והזן את שם המוצר — והוא יישמר מיד עם התמונה בכרטיס החבילה.

צרפתי חכה יש עוד שניים אל תעשה כלום

קיבלתי את 10 צילומי המסך הראשונים — אני ממתין לשניים הנוספים ולא נוגע בכלום עד שתעלה אותם.


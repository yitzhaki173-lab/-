name: Build PackTrack IL v2.0 Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Android APK from Standalone App
        run: |
          npm install -g cordova
          cordova create packtrack com.packtrack.il "PackTrack IL"
          cp packtrack_il_v2_standalone.html packtrack/www/index.html
          cd packtrack
          cordova platform add android
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../PackTrack-IL-v2.0.apk

      - name: Upload APK to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: PackTrack-IL-v2.0-APK
          path: PackTrack-IL-v2.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: PackTrack IL v2.0 (Android APK)
          files: PackTrack-IL-v2.0.apk

name: Build PackTrack IL v3.1 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare Android WebView Project & Build APK (Fixed Key)
        run: |
          set -e

          # 1. Install permanent fixed debug.keystore so Android ALWAYS updates in-place without uninstalling!
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

          rm -rf build_apk
          mkdir -p build_apk/app/src/main/assets
          mkdir -p build_apk/app/src/main/java/com/packtrack/il

          # 2. Automatically find the latest v3.1 / v3.0 HTML file in the repository
          HTML_FILE=$(grep -rl "v3.1.0" --include="*.html" . 2>/dev/null | head -n 1 || true)
          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(grep -rl "v3.0" --include="*.html" . 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$HTML_FILE" ] && [ -f "packtrack_il_v2_standalone.html" ]; then
            HTML_FILE="packtrack_il_v2_standalone.html"
          fi
          if [ -z "$HTML_FILE" ] && [ -f "index.html" ]; then
            HTML_FILE="index.html"
          fi
          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 5 -name "*.html" -not -path "./build_apk/*" | head -n 1)
          fi

          if [ -z "$HTML_FILE" ] || [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: Could not find HTML file in the repository!"
            exit 1
          fi

          echo "Using HTML file: $HTML_FILE"
          cp "$HTML_FILE" build_apk/app/src/main/assets/index.html

          cat << 'EOF_SET' > build_apk/settings.gradle
          rootProject.name = "PackTrackIL"
          include ":app"
          EOF_SET

          cat << 'EOF_BG' > build_apk/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF_BG

          cat << 'EOF_PROP' > build_apk/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF_PROP

          VER_CODE=$((100 + ${{ github.run_number }}))
          VER_NAME="3.1.${{ github.run_number }}"

          cat << EOF_APP > build_apk/app/build.gradle
          apply plugin: "com.android.application"

          android {
              namespace "com.packtrack.il"
              compileSdk 34

              defaultConfig {
                  applicationId "com.packtrack.il"
                  minSdk 24
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "${VER_NAME}"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_APP

          cat << 'EOF_MAN' > build_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="PackTrack IL"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MAN

          cat << 'EOF_JAVA' > build_apk/app/src/main/java/com/packtrack/il/MainActivity.java
          package com.packtrack.il;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("file://")) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              return true;
                          } catch (Exception e) {
                              return false;
                          }
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF_JAVA

          cd build_apk
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../PackTrack-IL-v3.1.apk

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: PackTrack-IL-v3.1-APK
          path: PackTrack-IL-v3.1.apk

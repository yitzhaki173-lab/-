<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>PackTrack IL v3.0 — כל 33 מוצרי AliExpress עם תמונות, סנכרון מתוקן, עריכת מסך בית והגדרות</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --app-font-scale: 1;
    }
    html {
      font-size: calc(16px * var(--app-font-scale));
    }
    body {
      font-family: 'Heebo', 'Inter', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .pulse-dot {
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }
    .spin-slow {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .img-zoom-cursor {
      cursor: zoom-in;
    }
    .edit-mode-ring {
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.75);
    }
  </style>
</head>
<body class="min-h-screen pb-28">

  <!-- Sticky Top App Bar -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 sm:px-4 py-2.5">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2.5">
      <div class="flex items-center gap-2.5">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-900/40 shrink-0">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-lg sm:text-xl font-black tracking-tight text-white">PackTrack IL</h1>
            <span id="appVersionBadge" class="px-2.5 py-0.5 text-xs font-extrabold rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">v3.0.0</span>
            <button id="btnQuickFontToggle" type="button" class="px-2 py-0.5 text-xs font-bold rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 transition" title="הגדל טקסט ונגישות">
              נגישות A+
            </button>
          </div>
          <p class="text-xs text-slate-300">כל 33 מוצרי AliExpress עם תמונות • סנכרון חכם מתוקן • סידור מסך בית</p>
        </div>
      </div>

      <!-- Main Top Action Buttons -->
      <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
        <button id="btnToggleHomeEditMode" type="button" class="px-3 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-400/40 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition">
          <span>✋ סדר מסך בית</span>
        </button>

        <button id="btnSyncNow" type="button" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-extrabold shadow-lg shadow-emerald-900/40 flex items-center gap-1.5 transition">
          <svg id="iconSyncNow" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span id="txtSyncNow">סנכרן עכשיו</span>
        </button>

        <button id="btnTopSettings" type="button" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs sm:text-sm font-bold flex items-center gap-1 transition">
          <span>⚙️ הגדרות</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Smart Sync Status Banner (Collapsible via Settings) -->
  <section id="sectionSyncBanner" class="max-w-5xl mx-auto px-3 sm:px-4 pt-3">
    <div class="glass-card rounded-2xl p-3.5 border border-emerald-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-start sm:items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center shrink-0 mt-0.5 sm:mt-0">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 pulse-dot"></span>
        </div>
        <div>
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-xs sm:text-sm font-extrabold text-emerald-300" id="syncStatusHeadline">סנכרון v3.0 הושלם (22/10/2026): 33 מוצרי AliExpress עם תמונות + עדכוני מסירה!</span>
            <span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700" id="lastSyncTimeBadge">סונכרן: 22/10/2026 04:50</span>
          </div>
          <p class="text-xs text-slate-300 mt-0.5" id="syncStatusSubtext">
            זוהה במייל מ-21/10: חבילת Temu/YDM (20072588) נמסרה בהצלחה להופיין 59! חבילת RN0043743436Y עודכנה עם 5 פריטי מקיטה, וחבילה חדשה RN0044168836Y נכנסה למכס.
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="btnOpenSyncReportModal" type="button" class="px-3 py-1.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-xs font-extrabold text-emerald-300 border border-emerald-500/30 transition">
          📊 דו״ח סנכרון
        </button>
        <button id="btnAddPackageModal" type="button" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-extrabold text-white transition">
          + הוסף חבילה
        </button>
      </div>
    </div>
  </section>

  <!-- Home Screen Edit & Customize Toolbar (Shown when "סדר מסך בית" is clicked) -->
  <section id="homeEditToolbar" class="max-w-5xl mx-auto px-3 sm:px-4 pt-3 hidden">
    <div class="glass-card rounded-2xl p-4 border-2 border-amber-400/60 bg-amber-950/25 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="text-base">🎨</span>
          <div>
            <h2 class="text-sm sm:text-base font-black text-amber-300">מצב עריכה וסידור מסך הבית פעיל</h2>
            <p class="text-xs text-slate-300">השתמש בחצים ⬆️⬇️ או בכפתור 📌 שעל כל כרטיס כדי לשנות את הסדר, או בחר עיצוב ומיון מהיר:</p>
          </div>
        </div>
        <button id="btnCloseHomeEditMode" type="button" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold">
          ✓ סיום ושמירת סידור
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1 text-xs">
        <div class="p-2.5 rounded-xl bg-slate-900/90 border border-slate-700">
          <label class="block text-slate-400 font-bold mb-1">📐 תצוגת כרטיסים במסך הבית:</label>
          <div class="grid grid-cols-3 gap-1">
            <button type="button" data-layout-mode="FULL" class="layout-mode-btn py-1.5 px-2 rounded-lg font-bold bg-emerald-600 text-white">מלאה</button>
            <button type="button" data-layout-mode="COMPACT" class="layout-mode-btn py-1.5 px-2 rounded-lg font-bold bg-slate-800 text-slate-300">קומפקטית</button>
            <button type="button" data-layout-mode="LIST" class="layout-mode-btn py-1.5 px-2 rounded-lg font-bold bg-slate-800 text-slate-300">רשימה</button>
          </div>
        </div>

        <div class="p-2.5 rounded-xl bg-slate-900/90 border border-slate-700">
          <label class="block text-slate-400 font-bold mb-1">🔀 סדר מיון כרטיסים:</label>
          <select id="selectHomeSortOrder" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-600 text-white font-bold">
            <option value="CUSTOM">הסידור האישי שלי (מוצמדים + ⬆️⬇️)</option>
            <option value="URGENT">הכי דחוף / הגיע לארץ קודם</option>
            <option value="NEWEST">לפי תאריך עדכון (החדש ביותר)</option>
            <option value="ITEMS_COUNT">לפי מספר פריטים בחבילה</option>
            <option value="STORE">לפי חנות (AliExpress / ACE)</option>
          </select>
        </div>

        <div class="p-2.5 rounded-xl bg-slate-900/90 border border-slate-700 flex flex-col justify-between gap-1.5">
          <span class="text-slate-400 font-bold">⚡ פעולות מהירות למסך הבית:</span>
          <div class="flex flex-wrap gap-1.5">
            <button id="btnToggleExpandAllItems" type="button" class="flex-1 py-1.5 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-600 font-bold">
              פתח/כווץ פירוט מוצרים
            </button>
            <button id="btnResetHomeOrder" type="button" class="py-1.5 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-rose-300 border border-slate-600 font-bold">
              אפס סדר
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Summary KPI Cards (Can be toggled in Settings) -->
  <section id="sectionKpiCards" class="max-w-5xl mx-auto px-3 sm:px-4 pt-3 grid grid-cols-2 sm:grid-cols-4 gap-2.5">
    <div id="kpiCardActiveBtn" class="glass-card rounded-2xl p-3 border-r-4 border-r-emerald-500 cursor-pointer hover:border-slate-500 transition">
      <div class="text-xs text-slate-400">חבילות ומשלוחים פעילים</div>
      <div class="text-2xl font-black text-white mt-0.5" id="kpiActiveCount">8</div>
      <div class="text-[11px] text-emerald-400 mt-0.5">כולל תמונות ופירוט מלא</div>
    </div>
    <div id="kpiCardAllItemsBtn" class="glass-card rounded-2xl p-3 border-r-4 border-r-amber-500 cursor-pointer hover:border-slate-500 transition">
      <div class="text-xs text-slate-400">מוצרי AliExpress שבדרך</div>
      <div class="text-2xl font-black text-amber-300 mt-0.5" id="kpiAliItemsCount">33</div>
      <div class="text-[11px] text-amber-200/90 mt-0.5">לחץ לצפייה בכל 33 התמונות</div>
    </div>
    <div id="kpiCardArrivedBtn" class="glass-card rounded-2xl p-3 border-r-4 border-r-sky-500 cursor-pointer hover:border-slate-500 transition">
      <div class="text-xs text-slate-400">נחתו בארץ / במכס / חולון</div>
      <div class="text-2xl font-black text-sky-300 mt-0.5" id="kpiTransitCount">5</div>
      <div class="text-[11px] text-sky-200/90 mt-0.5">דואר ישראל + ACE עד הבית</div>
    </div>
    <div id="kpiCardCollectedBtn" class="glass-card rounded-2xl p-3 border-r-4 border-r-purple-500 cursor-pointer hover:border-slate-500 transition">
      <div class="text-xs text-slate-400">נמסרו / נאספו (היסטוריה)</div>
      <div class="text-2xl font-black text-purple-300 mt-0.5" id="kpiCollectedCount">6</div>
      <div class="text-[11px] text-purple-200/90 mt-0.5">כולל Temu YDM שנמסר ב-21/10</div>
    </div>
  </section>

  <!-- Accessible Navigation & Search Bar -->
  <section class="max-w-5xl mx-auto px-3 sm:px-4 pt-4">
    <div class="flex flex-col gap-2.5 border-b border-slate-800 pb-3">
      <!-- Top View Switcher Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
        <button id="tabBtnActive" type="button" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-emerald-600 text-white transition flex items-center gap-1.5 shrink-0">
          <span>🏠 מסך בית (חבילות)</span>
          <span id="badgeTabActive" class="px-1.5 py-0.2 rounded-full text-xs bg-black/25">8</span>
        </button>
        <button id="tabBtnAllProducts" type="button" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition flex items-center gap-1.5 shrink-0">
          <span>🛍️ כל 33 מוצרי AliExpress</span>
          <span id="badgeTabAllProducts" class="px-1.5 py-0.2 rounded-full text-xs bg-amber-500/25 text-amber-300">33</span>
        </button>
        <button id="tabBtnCollected" type="button" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition flex items-center gap-1.5 shrink-0">
          <span>✅ נמסרו / נאספו</span>
          <span id="badgeTabCollected" class="px-1.5 py-0.2 rounded-full text-xs bg-slate-700">6</span>
        </button>
        <button id="tabBtnSmsParser" type="button" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition shrink-0">
          📲 קליטת SMS / קישור
        </button>
        <button id="tabBtnSettings" type="button" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition shrink-0">
          ⚙️ הגדרות
        </button>
      </div>

      <!-- Search + Quick Accessible Filter Chips -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
          <button type="button" data-chip-filter="ALL" class="chip-filter-btn px-3 py-1 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shrink-0">הכל</button>
          <button type="button" data-chip-filter="דואר ישראל" class="chip-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0">דואר ישראל (5)</button>
          <button type="button" data-chip-filter="AliExpress" class="chip-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0">AliExpress</button>
          <button type="button" data-chip-filter="ACE" class="chip-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0">ACE מעמד נעליים</button>
          <button type="button" data-chip-filter="URGENT" class="chip-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-slate-800 text-amber-300 hover:bg-slate-700 shrink-0">⚡ דורש בדיקה / בארץ</button>
        </div>

        <div class="flex items-center gap-2">
          <input id="searchInput" type="text" placeholder="חפש מוצר (למשל: מקיטה, מאוורר, Odin, RN004)..." class="w-full sm:w-64 px-3 py-1.5 rounded-xl bg-slate-800/95 border border-slate-700 text-xs sm:text-sm text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500" />
        </div>
      </div>
    </div>
  </section>

  <!-- VIEW 1: Home Screen (Active Packages with Visual Product Grids & Reordering) -->
  <main id="viewActivePackages" class="max-w-5xl mx-auto px-3 sm:px-4 pt-4">
    <div id="activePackagesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <!-- VIEW 2: All 33 Individual AliExpress Products Gallery -->
  <section id="viewAllProducts" class="max-w-5xl mx-auto px-3 sm:px-4 pt-4 hidden">
    <div class="glass-card rounded-2xl p-4 mb-4 border border-amber-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h2 class="text-sm sm:text-base font-black text-amber-300">🛍️ גלריית כל 33 המוצרים מ-AliExpress (מתוך צילומי המסך שלך)</h2>
        <p class="text-xs text-slate-300 mt-0.5">
          כל פריט מוצג עם התמונה המקורית שלו, מספר ההזמנה המדויק ב-AliExpress (`1123...`), תאריך ההזמנה, המחיר והחבילה המשויכת. לחיצה על "✓ קיבלתי פריט זה" תסמן שהמוצר הגיע!
        </p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <select id="selectGalleryDateFilter" class="px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white font-bold">
          <option value="ALL">כל התאריכים (33 מוצרים)</option>
          <option value="16/10/2026">הזמנות 16/10/2026 (10 מוצרים)</option>
          <option value="12/10/2026">הזמנות 12/10/2026 (11 מוצרים)</option>
          <option value="09/10/2026">הזמנות 09/10/2026 (7 מוצרים)</option>
          <option value="05/10/2026">הזמנות 05/10/2026 (4 מוצרים)</option>
          <option value="01/10/2026">הזמנת 01/10/2026 (מסור טלסקופי)</option>
        </select>
      </div>
    </div>
    <div id="allProductsGalleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5"></div>
  </section>

  <!-- VIEW 3: Collected / Delivered Packages View -->
  <section id="viewCollectedPackages" class="max-w-5xl mx-auto px-3 sm:px-4 pt-4 hidden">
    <div class="glass-card rounded-2xl p-4 mb-4 border border-purple-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h2 class="text-sm sm:text-base font-black text-purple-200">✅ חבילות שנמסרו / נאספו (כולל Temu YDM שנמסר ב-21/10 ו-KSP)</h2>
        <p class="text-xs text-slate-300 mt-0.5">
          הסנכרון החכם זיהה במייל מ-21/10/2026 שחבילת Temu/YDM (20072588) נמסרה בהצלחה להופיין 59 חולון ע״י השליח נאור, והעביר אותה לכאן אוטומטית.
        </p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="btnClearAllCollected" type="button" class="px-3 py-1.5 rounded-xl bg-rose-600/20 hover:bg-rose-600/35 text-rose-300 border border-rose-500/30 text-xs font-bold transition">
          נקה היסטוריה
        </button>
      </div>
    </div>
    <div id="collectedPackagesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </section>

  <!-- VIEW 4: Smart SMS & Link Verifier View -->
  <section id="viewSmsParser" class="max-w-5xl mx-auto px-3 sm:px-4 pt-4 hidden">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="glass-card rounded-2xl p-4 border border-emerald-500/30">
        <h3 class="text-base font-extrabold text-emerald-300 flex items-center gap-2">
          <span>📲 קליטת SMS או מייל חדש (עדכון מדף / איסוף / מסירה)</span>
        </h3>
        <p class="text-xs text-slate-300 mt-1">
          קיבלת SMS מדואר ישראל, צ'יטה, YDM או געש? הדבק אותו כאן והמערכת תזהה אוטומטית את מספר החבילה, תעדכן את נקודת האיסוף והמדף, או תעביר ל"נמסרו".
        </p>
        <textarea id="smsRawInput" rows="3" placeholder="הדבק כאן הודעת SMS או טקסט ממייל..." class="w-full mt-3 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400"></textarea>
        <div class="flex flex-wrap gap-2 mt-2.5">
          <button id="btnParseSms" type="button" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm transition">
            פענח ועדכן חבילה
          </button>
          <button id="btnDemoSmsPickup" type="button" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition">
            דוגמה: SMS הגעה לדואר ישראל
          </button>
          <button id="btnDemoSmsDelivered" type="button" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition">
            דוגמה: SMS חבילה נמסרה

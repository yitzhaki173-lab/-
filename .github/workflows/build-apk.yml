מה חדש ומה תוקן בגרסה v3.0.0
תיקון הסנכרון ועדכונים חדשים שזוהו ב-Gmail (21–22/10/2026):

חבילת Temu / YDM (20072588 / TMU011623525) סומנה כנמסרה: הסנכרון זיהה את מייל אישור המסירה מ-YDM ואת מייל המסירה מ-Temu מאתמול (21/10 בשעה 09:30 — נמסר ליוסי בהופיין 59 חולון ע"י השליח נאור 053-8270071), והעביר אותה אוטומטית ללשונית "✅ נמסרו / נאספו".

שיוך מלא לחבילת RN0043743436Y מהמייל החדש: בזכות הפעלת ההתראות באפליקציית AliExpress, הגיע מייל עדכון מסירה מ-AliExpress שחשף שברקוד זה מכיל את 5 מוצרי העבודה מ-09/10 (מברגת אימפקט Makita DTD173, פנס Makita 18V עם USB, תפס מגנטי Makita E-03442, מאריך ביטים 200 מ"מ ו-8 גלגלים לרהיטים).

חבילה חדשה במכס (RN0044168836Y): נקלט אוטומטית מייל כניסה למכס מ-AliExpress מאתמול (21/10 בשעה 14:45) עבור הזמנת משחקי הקופסה מ-16/10 (משחק הקלפים Odin + Kariba + No Thanks + In A Grove + סט 4 פינצטות).

הטמעת כל 33 מוצרי AliExpress עם התמונות המקוריות שלהם:

חתכתי והטמעתי את כל 33 תמונות המוצרים מתוך 11 צילומי המסך שהעלית ישירות לתוך קוד האפליקציה (ללא תלות בקישורים חיצוניים), גם בתוך כרטיסי החבילות המאוחדות (RN0043643276Y, RN0043530126Y, RS001214914S1, הזמנות ה-16/10, כלי העבודה והסוללות, ומעמד הנעליים מ-ACE Online) וגם בלשונית ייעודית חדשה "🛍️ כל 33 מוצרי AliExpress".

עריכה וסידור מסך הבית ("✋ סדר מסך בית"):

לחיצה על "✋ סדר מסך בית" בראש המסך (או על הכפתורים המהירים שעל כל כרטיס) מאפשרת להצמיד כרטיסים לראש המסך (📌), להזיז כרטיסים למעלה ולמטה (⬆️ / ⬇️), לערוך כל כרטיס (✏️), ולבחור בין 3 מצבי תצוגה (מלאה, קומפקטית, רשימה נקייה) ומיון מהיר.

נגישות ומסך הגדרות מלא (⚙️ הגדרות):

נוסף סרגל ניווט תחתון נגיש לנייד, כפתור "נגישות A+" להגדלת הגופן והכפתורים (100% / 112% / 124%), ומסך הגדרות מלא לשליטה בהצגת קוביות הסיכום, פתיחה/כיווץ של פירוט המוצרים, הגדרות סנכרון, ייצוא גיבוי ורענון מלא בלחיצה.

כדי לעדכן את האפליקציה בטלפון דרך GitHub, העלה את תוכן הקובץ המעודכן אל www/index.html (או חלץ את קובץ ה-ZIP לריפוזיטורי) והורד את ה-APK החדש מ-Actions.

יש בעיה משהו

השגיאה בצילום המסך (Invalid workflow file) קרתה כי הדבקת בטעות את קוד ה-HTML של האפליקציה (<!DOCTYPE html>...) לתוך הקובץ .github/workflows/build-apk.yml במקום לתוך קובץ ה-index.html.


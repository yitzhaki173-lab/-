    function renderAllProductsGallery() {
      var grid = document.getElementById('allProductsGalleryGrid');
      if (!grid) return;
      var q = state.searchQuery.trim().toLowerCase();
      var df = state.galleryDateFilter;

      var filtered = state.aliItems.filter(function(it) {
        if (df !== 'ALL' && it.date !== df) return false;
        if (q) {
          var hay = (it.heName + ' ' + it.enName + ' ' + it.ref + ' ' + it.store + ' ' + it.price).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      document.getElementById('badgeTabAllProducts').textContent = String(state.aliItems.filter(function(i) { return !i.received; }).length);
      document.getElementById('kpiAliItemsCount').textContent = String(state.aliItems.filter(function(i) { return !i.received; }).length);

      grid.innerHTML = filtered.map(function(it) {
        var isRec = !!it.received;
        return '<div class="glass-card rounded-2xl p-3.5 border ' + (isRec ? 'border-purple-500/40 opacity-75' : 'border-slate-700/90') + ' flex flex-col justify-between gap-2.5">' +
          '<div class="flex items-start gap-3">' +
          '<img src="' + it.img + '" alt="" class="w-20 h-20 rounded-xl object-contain bg-white p-1 border border-slate-700 shrink-0" />' +
          '<div class="min-w-0 flex-1">' +
          '<div class="flex items-center justify-between gap-1 text-[11px] text-slate-400">' +
          '<span class="font-bold text-amber-300">' + it.date + '</span>' +
          '<span class="font-extrabold text-emerald-400 text-xs">' + it.price + '</span>' +
          '</div>' +
          '<h4 class="text-xs sm:text-sm font-black text-white mt-0.5 leading-snug">' + it.heName + '</h4>' +
          '<p class="text-[11px] text-slate-400 mt-0.5 line-clamp-2">' + it.enName + '</p>' +
          '</div></div>' +
          '<div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-2 text-[11px]">' +
          '<button type="button" data-action="copy" data-tracking="' + it.ref + '" class="px-2 py-1 rounded-lg bg-slate-800 text-slate-300 font-mono">#' + it.ref + ' 📋</button>' +
          '<button type="button" data-action="toggle-ali-item" data-item-id="' + it.id + '" class="px-3 py-1.5 rounded-xl font-extrabold ' + (isRec ? 'bg-purple-600/30 text-purple-200' : 'bg-emerald-600 hover:bg-emerald-500 text-white') + '">' +
          (isRec ? '✓ התקבל (בטל)' : '✓ קיבלתי פריט זה') +
          '</button></div></div>';
      }).join('');
    }

    function getSortedActivePackages(list) {
      var order = state.settings.sortOrder || 'CUSTOM';
      var copy = list.slice();
      copy.sort(function(a, b) {
        if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
        if (order === 'URGENT') {
          if (!!a.requiresAction !== !!b.requiresAction) return a.requiresAction ? -1 : 1;
          return (b.sortTimestamp || 0) - (a.sortTimestamp || 0);
        }
        if (order === 'NEWEST') {
          return (b.sortTimestamp || 0) - (a.sortTimestamp || 0);
        }
        if (order === 'ITEMS_COUNT') {
          var ca = (a.subProductIds && a.subProductIds.length) || (a.itemsList && a.itemsList.length) || 1;
          var cb = (b.subProductIds && b.subProductIds.length) || (b.itemsList && b.itemsList.length) || 1;
          return cb - ca;
        }
        if (order === 'STORE') {
          return (a.store || '').localeCompare(b.store || '');
        }
        return 0;
      });
      return copy;
    }

    function matchesSearch(pkg, q) {
      if (!q) return true;
      var hay = (pkg.title + ' ' + pkg.trackingNumber + ' ' + pkg.store + ' ' + (pkg.whatOrderedSummary || '') + ' ' + (pkg.itemsList || []).join(' ')).toLowerCase();
      return hay.indexOf(q) !== -1;
    }

    function renderAll() {
      applySettingsToDom();
      var q = state.searchQuery.trim().toLowerCase();
      var cf = state.chipFilter;

      var activeRaw = state.packages.filter(function(p) {
        if (p.collected) return false;
        if (cf === 'URGENT' && !p.requiresAction && p.courierGroup !== 'דואר ישראל') return false;
        if (cf !== 'ALL' && cf !== 'URGENT') {
          if (p.courierGroup !== cf && p.store.indexOf(cf) === -1) return false;
        }
        if (!matchesSearch(p, q)) return false;
        return true;
      });

      var activeList = getSortedActivePackages(activeRaw);

      var collectedList = state.packages.filter(function(p) {
        if (!p.collected) return false;
        if (!matchesSearch(p, q)) return false;
        return true;
      });

      var allActive = state.packages.filter(function(p) { return !p.collected; });
      var allCollected = state.packages.filter(function(p) { return p.collected; });
      var allArrived = allActive.filter(function(p) { return p.courierGroup === 'דואר ישראל' || p.courierGroup === 'ACE'; });

      document.getElementById('kpiActiveCount').textContent = String(allActive.length);
      document.getElementById('kpiTransitCount').textContent = String(allArrived.length);
      document.getElementById('kpiCollectedCount').textContent = String(allCollected.length);
      document.getElementById('badgeTabActive').textContent = String(allActive.length);
      document.getElementById('badgeTabCollected').textContent = String(allCollected.length);

      var activeGrid = document.getElementById('activePackagesGrid');
      if (state.settings.layoutMode === 'LIST' && !state.homeEditMode) {
        activeGrid.className = 'grid grid-cols-1 gap-2.5';
      } else if (state.settings.layoutMode === 'COMPACT') {
        activeGrid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3';
      } else {
        activeGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';
      }

      if (activeList.length === 0) {
        activeGrid.innerHTML = '<div class="col-span-full glass-card rounded-2xl p-8 text-center text-slate-300 text-sm">לא נמצאו חבילות פעילות התואמות לחיפוש. לחץ על "הכל" או עבור ללשונית "כל 33 מוצרי AliExpress".</div>';
      } else {
        activeGrid.innerHTML = activeList.map(renderPackageCard).join('');
      }

      var collectedGrid = document.getElementById('collectedPackagesGrid');
      if (collectedList.length === 0) {
        collectedGrid.innerHTML = '<div class="col-span-full glass-card rounded-2xl p-8 text-center text-slate-400 text-sm">היסטוריית החבילות שנמסרו ריקה.</div>';
      } else {
        collectedGrid.innerHTML = collectedList.map(renderPackageCard).join('');
      }

      renderAllProductsGallery();
    }

    function switchTab(tabName) {
      state.activeTab = tabName;
      var views = {
        ACTIVE: document.getElementById('viewActivePackages'),
        ALL_PRODUCTS: document.getElementById('viewAllProducts'),
        COLLECTED: document.getElementById('viewCollectedPackages'),
        SMS: document.getElementById('viewSmsParser'),
        SETTINGS: document.getElementById('viewSettings')
      };
      var topButtons = {
        ACTIVE: document.getElementById('tabBtnActive'),
        ALL_PRODUCTS: document.getElementById('tabBtnAllProducts'),
        COLLECTED: document.getElementById('tabBtnCollected'),
        SMS: document.getElementById('tabBtnSmsParser'),
        SETTINGS: document.getElementById('tabBtnSettings')
      };
      Object.keys(views).forEach(function(k) {
        if (k === tabName) {
          views[k].classList.remove('hidden');
          if (topButtons[k]) {
            topButtons[k].className = 'px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-emerald-600 text-white transition flex items-center gap-1.5 shrink-0';
          }
        } else {
          views[k].classList.add('hidden');
          if (topButtons[k]) {
            topButtons[k].className = 'px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition flex items-center gap-1.5 shrink-0';
          }
        }
      });

      document.querySelectorAll('.bottom-nav-btn').forEach(function(btn) {
        var navTarget = btn.getAttribute('data-bottom-nav');
        if (navTarget === tabName) {
          btn.className = 'bottom-nav-btn py-1.5 rounded-xl flex flex-col items-center justify-center text-emerald-400 font-extrabold text-[11px] bg-slate-800/90';
        } else {
          btn.className = 'bottom-nav-btn py-1.5 rounded-xl flex flex-col items-center justify-center text-slate-400 font-bold text-[11px]';
        }
      });
    }

    function runSmartSyncNow() {
      var icon = document.getElementById('iconSyncNow');
      var txt = document.getElementById('txtSyncNow');
      icon.classList.add('spin-slow');
      txt.textContent = 'מסנכרן נתונים...';

      var currentIds = {};
      state.packages.forEach(function(p) { currentIds[p.id] = p; });
      INITIAL_PACKAGES_V3.forEach(function(fresh) {
        if (!currentIds[fresh.id]) {
          state.packages.unshift(JSON.parse(JSON.stringify(fresh)));
        } else {
          var existing = currentIds[fresh.id];
          existing.productImage = existing.customImage || fresh.productImage;
          existing.subProductIds = fresh.subProductIds;
          if (fresh.id === 'pkg-ydm-20072588' || fresh.id === 'pkg-gaash-tmu011623525') {
            existing.collected = true;
            existing.statusText = fresh.statusText;
            existing.updatedDate = fresh.updatedDate;
          }
        }
      });
      saveStorage('packtrack_v3_0_packages', state.packages);

      setTimeout(function() {
        icon.classList.remove('spin-slow');
        txt.textContent = 'סנכרן עכשיו';
        var nowTime = new Date().toTimeString().slice(0, 5);
        document.getElementById('lastSyncTimeBadge').textContent = 'סונכרן: 22/10/2026 ' + nowTime;
        renderAll();
        var modal = document.getElementById('modalSyncReport');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', function() {
      renderAll();

      document.body.addEventListener('click', function(e) {
        var el = e.target.closest('[data-action]');
        if (!el) return;
        var action = el.getAttribute('data-action');
        var id = el.getAttribute('data-id');
        if (action === 'received') {
          markPackageReceived(id, 'סומן ב"קיבלתי"');
        } else if (action === 'restore') {
          restorePackageToActive(id);
        } else if (action === 'delete') {
          deletePackagePermanently(id);
        } else if (action === 'copy') {
          copyTextSafe(el.getAttribute('data-tracking') || '');
        } else if (action === 'zoom-img') {
          openImageZoomModal(id);
        } else if (action === 'edit-pkg') {
          openEditPackageModal(id);
        } else if (action === 'pin-pkg') {
          togglePinPackage(id);
        } else if (action === 'move-up') {
          movePackageOrder(id, 'UP');
        } else if (action === 'move-down') {
          movePackageOrder(id, 'DOWN');
        } else if (action === 'toggle-ali-item') {
          var itemId = el.getAttribute('data-item-id');
          var item = state.aliItems.find(function(x) { return x.id === itemId; });
          if (item) {
            item.received = !item.received;
            saveStorage('packtrack_v3_0_ali_items', state.aliItems);
            renderAllProductsGallery();
            showToast(item.received ? '✓ המוצר סומן כ"התקבל"!' : 'המוצר הוחזר לסטטוס ממתין למסירה', null);
          }
        }
      });

      var editToolbar = document.getElementById('homeEditToolbar');
      function toggleHomeEdit(forceState) {
        state.homeEditMode = typeof forceState === 'boolean' ? forceState : !state.homeEditMode;
        if (state.homeEditMode) {
          switchTab('ACTIVE');
          editToolbar.classList.remove('hidden');
        } else {
          editToolbar.classList.add('hidden');
        }
        renderAll();
      }
      document.getElementById('btnToggleHomeEditMode').addEventListener('click', function() { toggleHomeEdit(); });
      document.getElementById('btnCloseHomeEditMode').addEventListener('click', function() {
        toggleHomeEdit(false);
        showToast('סידור מסך הבית נשמר!', null);
      });

      document.querySelectorAll('.layout-mode-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          state.settings.layoutMode = btn.getAttribute('data-layout-mode');
          saveSettings();
          showToast('תצוגת מסך הבית עודכנה!', null);
        });
      });

      document.querySelectorAll('.font-scale-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          state.settings.fontScale = parseFloat(btn.getAttribute('data-font-scale')) || 1;
          saveSettings();
          showToast('גודל הטקסט והכפתורים עודכן!', null);
        });
      });

      document.getElementById('btnQuickFontToggle').addEventListener('click', function() {
        if (state.settings.fontScale < 1.1) state.settings.fontScale = 1.14;
        else if (state.settings.fontScale < 1.2) state.settings.fontScale = 1.24;
        else state.settings.fontScale = 1;
        saveSettings();
        showToast('גודל תצוגה ונגישות: ' + Math.round(state.settings.fontScale * 100) + '%', null);
      });

      document.getElementById('selectHomeSortOrder').addEventListener('change', function(e) {
        state.settings.sortOrder = e.target.value;
        saveSettings();
        showToast('מיון מסך הבית עודכן!', null);
      });

      document.getElementById('btnToggleExpandAllItems').addEventListener('click', function() {
        state.settings.showItemsExpanded = !state.settings.showItemsExpanded;
        saveSettings();
        showToast(state.settings.showItemsExpanded ? 'פירוט המוצרים נפתח בכל הכרטיסים' : 'פירוט המוצרים כווץ לתצוגה נקייה', null);
      });

      function resetHomeOrderNow() {
        state.packages = JSON.parse(JSON.stringify(INITIAL_PACKAGES_V3));
        state.aliItems = JSON.parse(JSON.stringify(ALL_33_ALI_ITEMS));
        state.settings.sortOrder = 'CUSTOM';
        saveStorage('packtrack_v3_0_packages', state.packages);
        saveStorage('packtrack_v3_0_ali_items', state.aliItems);
        saveSettings();
        showToast('כל הנתונים, התמונות והסדר אופסו לגרסה v3.0!', null);
      }
      document.getElementById('btnResetHomeOrder').addEventListener('click', resetHomeOrderNow);
      document.getElementById('btnResetCardOrdering').addEventListener('click', resetHomeOrderNow);
      document.getElementById('btnForceResetToV3').addEventListener('click', resetHomeOrderNow);

      document.getElementById('settingShowItemsExpanded').addEventListener('change', function(e) {
        state.settings.showItemsExpanded = !!e.target.checked;
        saveSettings();
      });
      document.getElementById('settingShowKpiCards').addEventListener('change', function(e) {
        state.settings.showKpiCards = !!e.target.checked;
        saveSettings();
      });
      document.getElementById('settingShowSyncBanner').addEventListener('change', function(e) {
        state.settings.showSyncBanner = !!e.target.checked;
        saveSettings();
      });
      document.getElementById('settingAutoDeleteOnReceive').addEventListener('change', function(e) {
        state.settings.autoDeleteOnReceive = !!e.target.checked;
        saveSettings();
      });

      document.getElementById('btnExportBackupJson').addEventListener('click', function() {
        var dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ packages: state.packages, settings: state.settings }, null, 2));
        var a = document.createElement('a');
        a.setAttribute('href', dataStr);
        a.setAttribute('download', 'packtrack_il_v3_backup.json');
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast('קובץ הגיבוי הורד בהצלחה!', null);
      });

      document.getElementById('tabBtnActive').addEventListener('click', function() { switchTab('ACTIVE'); });
      document.getElementById('tabBtnAllProducts').addEventListener('click', function() { switchTab('ALL_PRODUCTS'); });
      document.getElementById('tabBtnCollected').addEventListener('click', function() { switchTab('COLLECTED'); });
      document.getElementById('tabBtnSmsParser').addEventListener('click', function() { switchTab('SMS'); });
      document.getElementById('tabBtnSettings').addEventListener('click', function() { switchTab('SETTINGS'); });
      document.getElementById('btnTopSettings').addEventListener('click', function() { switchTab('SETTINGS'); });

      document.querySelectorAll('.bottom-nav-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          switchTab(btn.getAttribute('data-bottom-nav'));
        });
      });

      document.getElementById('kpiCardActiveBtn').addEventListener('click', function() { switchTab('ACTIVE'); });
      document.getElementById('kpiCardAllItemsBtn').addEventListener('click', function() { switchTab('ALL_PRODUCTS'); });
      document.getElementById('kpiCardArrivedBtn').addEventListener('click', function() {
        switchTab('ACTIVE');
        state.chipFilter = 'דואר ישראל';
        renderAll();
      });
      document.getElementById('kpiCardCollectedBtn').addEventListener('click', function() { switchTab('COLLECTED'); });

      document.querySelectorAll('.chip-filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          state.chipFilter = btn.getAttribute('data-chip-filter');
          document.querySelectorAll('.chip-filter-btn').forEach(function(b) {
            if (b.getAttribute('data-chip-filter') === state.chipFilter) {
              b.className = 'chip-filter-btn px-3 py-1 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shrink-0';
            } else {
              b.className = 'chip-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0';
            }
          });
          renderAll();
        });
      });

      document.getElementById('searchInput').addEventListener('input', function(e) {
        state.searchQuery = e.target.value;
        renderAll();
      });
      document.getElementById('selectGalleryDateFilter').addEventListener('change', function(e) {
        state.galleryDateFilter = e.target.value;
        renderAllProductsGallery();
      });

      document.getElementById('btnSyncNow').addEventListener('click', runSmartSyncNow);
      document.getElementById('btnOpenSyncReportModal').addEventListener('click', function() {
        var m = document.getElementById('modalSyncReport');
        m.classList.remove('hidden');
        m.classList.add('flex');
      });
      function closeSyncReport() {
        var m = document.getElementById('modalSyncReport');
        m.classList.add('hidden');
        m.classList.remove('flex');
      }
      document.getElementById('btnCloseSyncReportModal').addEventListener('click', closeSyncReport);
      document.getElementById('btnSyncReportConfirm').addEventListener('click', closeSyncReport);

      document.getElementById('btnCloseZoomModal').addEventListener('click', function() {
        var m = document.getElementById('modalImageZoom');
        m.classList.add('hidden');
        m.classList.remove('flex');
      });

      document.getElementById('btnCloseEditModal').addEventListener('click', function() {
        var m = document.getElementById('modalEditDetails');
        m.classList.add('hidden');
        m.classList.remove('flex');
      });
      document.getElementById('editPkgPhotoFile').addEventListener('change', function(e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
          state.pendingUploadedDataUrl = ev.target.result;
          showToast('התמונה נטענה! לחץ על "שמור שינויים בכרטיס"', null);
        };
        reader.readAsDataURL(file);
      });
      document.getElementById('btnSaveEditedPackage').addEventListener('click', function() {
        var pkgId = document.getElementById('editPkgId').value;
        var pkg = state.packages.find(function(p) { return p.id === pkgId; });
        if (!pkg) return;
        var newTitle = document.getElementById('editPkgTitle').value.trim();
        var newTrk = document.getElementById('editPkgTracking').value.trim();
        var newLoc = document.getElementById('editPkgLocation').value.trim();
        var newSt = document.getElementById('editPkgStatus').value.trim();
        var rawLines = document.getElementById('editPkgItemsText').value.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);

        if (newTitle) pkg.title = newTitle;
        if (newTrk) pkg.trackingNumber = newTrk;
        if (newLoc) pkg.pickupLocation = newLoc;
        if (newSt) pkg.statusText = newSt;
        if (rawLines.length > 0) pkg.itemsList = rawLines;
        if (state.pendingUploadedDataUrl) {
          pkg.productImage = state.pendingUploadedDataUrl;
          pkg.customImage = state.pendingUploadedDataUrl;
        }
        saveStorage('packtrack_v3_0_packages', state.packages);
        var m = document.getElementById('modalEditDetails');
        m.classList.add('hidden');
        m.classList.remove('flex');
        renderAll();
        showToast('הכרטיס עודכן ונשמר בהצלחה!', null);
      });

      document.getElementById('btnUndoAction').addEventListener('click', function() {
        if (state.lastUndoPkgId) {
          restorePackageToActive(state.lastUndoPkgId);
          state.lastUndoPkgId = null;
        }
      });

      document.getElementById('btnClearAllCollected').addEventListener('click', function() {
        state.packages = state.packages.filter(function(p) { return !p.collected; });
        saveStorage('packtrack_v3_0_packages', state.packages);
        renderAll();
        showToast('היסטוריית החבילות שנמסרו נוקתה', null);
      });

      var addModal = document.getElementById('modalAddPackage');
      document.getElementById('btnAddPackageModal').addEventListener('click', function() {
        addModal.classList.remove('hidden');
        addModal.classList.add('flex');
      });
      document.getElementById('btnCloseAddModal').addEventListener('click', function() {
        addModal.classList.add('hidden');
        addModal.classList.remove('flex');
      });
      document.getElementById('btnSaveNewPackage').addEventListener('click', function() {
        var title = document.getElementById('pkgInputTitle').value.trim();
        var store = document.getElementById('pkgInputStore').value.trim() || 'AliExpress / דואר ישראל';
        var tracking = document.getElementById('pkgInputTracking').value.trim() || ('RN' + Math.floor(Math.random() * 900000000 + 100000000) + 'Y');
        var desc = document.getElementById('pkgInputDesc').value.trim();
        var loc = document.getElementById('pkgInputLocation').value.trim() || 'חולון';
        if (!title) {
          showToast('נא להזין את שם המוצר או החבילה', null);
          return;
        }
        var newPkg = {
          id: 'pkg-custom-' + Date.now(),
          store: store,
          courierGroup: 'דואר ישראל',
          title: title,
          trackingNumber: tracking,
          orderId: tracking,
          statusText: 'נוסף למעקב במסך הבית',
          pickupLocation: loc,
          pickupCode: tracking,
          updatedDate: '22/10/2026',
          sortTimestamp: Date.now() / 1000,
          trackingUrl: 'https://israelpost.co.il/%D7%9E%D7%A2%D7%A7%D7%91-%D7%9E%D7%A9%D7%9C%D7%95%D7%97%D7%99%D7%9D/?itemcode=' + encodeURIComponent(tracking),
          storeOrderUrl: 'https://www.aliexpress.com/p/order/index.html',
          emailUrl: '',
          linkCheckResult: 'פעיל במעקב',
          productImage: AE_BUNDLE_IMGS.b1,
          fallbackImage: AE_BUNDLE_IMGS.b1,
          orderSheetImage: '',
          whatOrderedSummary: desc || title,
          subProductIds: [],
          itemsList: desc ? desc.split('\n') : [title],
          requiresAction: false,
          pinned: true,
          collected: false
        };
        state.packages.unshift(newPkg);
        saveStorage('packtrack_v3_0_packages', state.packages);
        document.getElementById('pkgInputTitle').value = '';
        document.getElementById('pkgInputStore').value = '';
        document.getElementById('pkgInputTracking').value = '';
        document.getElementById('pkgInputDesc').value = '';
        document.getElementById('pkgInputLocation').value = '';
        addModal.classList.add('hidden');
        addModal.classList.remove('flex');
        renderAll();
        showToast('החבילה נוספה והוצמדה לראש מסך הבית!', null);
      });

      document.getElementById('btnSampleCustomsLink').addEventListener('click', function() {
        document.getElementById('inputLinkToVerify').value = 'RN0044168836Y';
      });
      document.getElementById('btnSampleYdmLink').addEventListener('click', function() {
        document.getElementById('inputLinkToVerify').value = '20072588';
      });
      document.getElementById('btnVerifySingleLink').addEventListener('click', function() {
        var val = document.getElementById('inputLinkToVerify').value.trim();
        var box = document.getElementById('linkVerifyResultBox');
        if (!val) {
          showToast('הזן מספר מעקב או קישור לבדיקה', null);
          return;
        }
        box.classList.remove('hidden');
        if (val.indexOf('20072588') !== -1 || val.indexOf('TMU011623525') !== -1) {
          box.innerHTML = '<div class="text-purple-300 font-extrabold">✅ נמסר ב-21/10/2026 (09:30):</div><div class="text-slate-300 mt-1">משלוח Temu/YDM 20072588 נמסר בהצלחה ליוסי בהופיין 59 חולון ע״י השליח נאור (053-8270071).</div>';
        } else if (val.indexOf('RN0044168836Y') !== -1) {
          box.innerHTML = '<div class="text-sky-300 font-extrabold">🛃 במכס בארץ (21/10/2026 14:45):</div><div class="text-slate-300 mt-1">חבילת AliExpress RN0044168836Y (משחקי הקופסה מ-16/10) החלה שחרור ממכס ותועבר לדואר ישראל בחולון.</div>';
        } else if (val.indexOf('RN0043743436Y') !== -1) {
          box.innerHTML = '<div class="text-amber-300 font-extrabold">📦 דווח כ"נמסר" במייל AliExpress מ-21/10 (12:14):</div><div class="text-slate-300 mt-1">מכיל 5 מוצרים מ-09/10: מברגת אימפקט Makita DTD173, פנס Makita 18V, תפס מגנטי, מאריך וגלגלים.</div>';
        } else {
          box.innerHTML = '<div class="text-emerald-300 font-extrabold">🔗 המשלוח פעיל במעקב:</div><div class="text-slate-300 mt-1">הברקוד/קישור תקין ונמצא במעקב פעיל.</div>';
        }
      });

      document.getElementById('btnDemoSmsPickup').addEventListener('click', function() {
        document.getElementById('smsRawInput').value = 'דואר ישראל: דבר דואר RN0043643276Y ממתין לאיסוף בסופר פיקאפ חולון, מדף ב-19, קוד איסוף 4912.';
      });
      document.getElementById('btnDemoSmsDelivered').addEventListener('click', function() {
        document.getElementById('smsRawInput').value = 'דואר ישראל: חבילה RN0043743436Y נמסרה ללקוח בהצלחה. תודה!';
      });
      document.getElementById('btnParseSms').addEventListener('click', function() {
        var text = document.getElementById('smsRawInput').value.trim();
        var fb = document.getElementById('smsParseFeedback');
        if (!text) {
          showToast('הדבק הודעת SMS או מייל לפענוח', null);
          return;
        }
        fb.classList.remove('hidden');
        var matchedPkg = state.packages.find(function(p) { return text.indexOf(p.trackingNumber) !== -1; });
        var isDeliveredSms = (text.indexOf('נמסרה') !== -1 || text.indexOf('נאספה') !== -1);
        if (matchedPkg && isDeliveredSms) {
          markPackageReceived(matchedPkg.id, 'זוהה אוטומטית מהודעת SMS');
          fb.innerHTML = '<div class="text-purple-300 font-bold">✓ זוהתה מסירה עבור ' + matchedPkg.trackingNumber + '! החבילה הועברה ל"נמסרו".</div>';
        } else if (matchedPkg) {
          matchedPkg.statusText = '📍 מוכן לאיסוף! (עודכן מ-SMS)';
          matchedPkg.pickupLocation = text;
          matchedPkg.requiresAction = true;
          matchedPkg.pinned = true;
          saveStorage('packtrack_v3_0_packages', state.packages);
          renderAll();
          fb.innerHTML = '<div class="text-emerald-300 font-bold">✓ החבילה ' + matchedPkg.trackingNumber + ' עודכנה והוצמדה לראש מסך הבית!</div>';
        } else {
          fb.innerHTML = '<div class="text-amber-300 font-bold">ההודעה נקלטה במערכת.</div>';
        }
      });
    });
  </script>
</body>
</html>

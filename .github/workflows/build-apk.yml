היכנס ב-GitHub לקובץ .github/workflows/build-apk.yml ולחץ על סמל העיפרון (Edit).

מחק את כל קוד ה-HTML שנמצא שם כרגע.

פתח את הקובץ המצורף למעלה (build-apk.yml), העתק את התוכן שלו (שמתחיל ב-name: Build PackTrack IL v3.0 APK), הדבק אותו לתוך .github/workflows/build-apk.yml ולחץ על Commit changes.

שדרגתי עבורך את הקובץ הזה כך שהוא בונה בעצמו את מעטפת האנדרואיד סביב קובץ ה-HTML שלך ומייצר אוטומטית קובץ PackTrack-IL-v3.0-APK מוכן להתקנה גם אם אין תיקיית Gradle במאגר.

2. הדבקת קוד ה-HTML של האפליקציה לתוך index.html
חזור ללשונית Code הראשית במאגר שלך ב-GitHub.

לחץ על הקובץ index.html (או על קובץ ה-HTML הקיים במאגר, כמו www/index.html — תהליך הבנייה החדש יאתר אוטומטית את הקובץ שמכיל את גרסה v3.0).

לחץ על סמל העיפרון (Edit), מחק את הקוד הישן, והדבק לתוכו את קוד ה-HTML המלא של PackTrack IL v3.0 שמופיע בחלונית ה-Canvas שלצד הצ'אט (שמתחיל ב-<!DOCTYPE html>).

לחץ על Commit changes — ותוך כדקה תוכל להוריד את ה-APK המוכן מתוך לשונית Actions.

שלח את הקוד שהיה אני לא מוצא

הנה הקוד של הקובץ .github/workflows/build-apk.yml להעתקה ישירה מכאן — פשוט לחץ על כפתור ההעתקה בתיבה למטה והדבק אותו בתוך .github/workflows/build-apk.yml ב-GitHub:

YAML
name: Build PackTrack IL v3.0 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare Android WebView Project & Build APK
        run: |
          set -e
          rm -rf build_apk
          mkdir -p build_apk/app/src/main/assets
          mkdir -p build_apk/app/src/main/java/com/packtrack/il

          HTML_FILE=$(grep -rl "PackTrack IL" --include="*.html" . 2>/dev/null | head -n 1 || true)
          V3_FILE=$(grep -rl "v3.0" --include="*.html" . 2>/dev/null | head -n 1 || true)
          if [ -n "$V3_FILE" ]; then
            HTML_FILE="$V3_FILE"
          elif [ -f "index.html" ]; then
            HTML_FILE="index.html"
          elif [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 5 -name "*.html" -not -path "./build_apk/*" | head -n 1)
          fi

          if [ -z "$HTML_FILE" ] || [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: Could not find index.html in the repository!"
            exit 1
          fi

          cp "$HTML_FILE" build_apk/app/src/main/assets/index.html

          cat << 'EOF' > build_apk/settings.gradle
          rootProject.name = "PackTrackIL"
          include ":app"
          EOF

          cat << 'EOF' > build_apk/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > build_apk/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build_apk/app/build.gradle
          apply plugin: "com.android.application"

          android {
              namespace "com.packtrack.il"
              compileSdk 34

              defaultConfig {
                  applicationId "com.packtrack.il"
                  minSdk 24
                  targetSdk 34
                  versionCode 30
                  versionName "3.0.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > build_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="PackTrack IL v3.0"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > build_apk/app/src/main/java/com/packtrack/il/MainActivity.java
          package com.packtrack.il;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cd build_apk
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../PackTrack-IL-v3.0.apk

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: PackTrack-IL-v3.0-APK
          path: PackTrack-IL-v3.0.apk
איך לעדכן בשני צעדים קצרים:

בקובץ .github/workflows/build-apk.yml: מחק את הכל, הדבק את הקוד מהתיבה למעלה ולחץ על Commit changes.

בקובץ index.html (בדף הראשי של המאגר שלך): פתח אותו לעריכה, הדבק לתוכו את קוד ה-HTML של האפליקציה (<!DOCTYPE html>... שמופיע בחלונית שלצד הצ'אט) ולחץ על Commit changes.

איפה אינדקס?

בצילום המסך שלך הקובץ נמצא ממש בשורה האחרונה למטה ונקרא:
packtrack_il_v2_standalone.html

כך תעדכן אותו:

לחץ על הקובץ התחתון ברשימה: packtrack_il_v2_standalone.html.

לחץ על סמל העיפרון (Edit file) בפינה העליונה.

מחק את כל הקוד הישן שבתוכו, והדבק במקומו את הקוד של PackTrack IL v3.0 מהחלונית שלצד הצ'אט (<!DOCTYPE html>...).

לחץ על הכפתור הירוק Commit changes.

קובץ ה-build-apk.yml שכבר עדכנת יזהה אוטומטית את הקובץ packtrack_il_v2_standalone.html ויבנה ממנו את ה-APK המעודכן של גרסה v3.0.

מעורבב פה 3 הזמנות ביחד למה?

הפרדתי עכשיו בקובץ המעודכן (packtrack_il_v3_0.html שנפתח לצד הצ'אט, גרסה v3.1.0) את 3 ההזמנות האלו ל-3 כרטיסים נפרדים ועצמאיים, והוספתי גם כפתור ✂️ פצל להזמנות נפרדות על כל חבילה מאוחדת.


    function applySettingsToDom() {
      document.documentElement.style.setProperty('--app-font-scale', String(state.settings.fontScale || 1));

      var kpiSec = document.getElementById('sectionKpiCards');
      if (kpiSec) {
        if (state.settings.showKpiCards) kpiSec.classList.remove('hidden');
        else kpiSec.classList.add('hidden');
      }

      var syncSec = document.getElementById('sectionSyncBanner');
      if (syncSec) {
        if (state.settings.showSyncBanner) syncSec.classList.remove('hidden');
        else syncSec.classList.add('hidden');
      }

      var elExp = document.getElementById('settingShowItemsExpanded');
      if (elExp) elExp.checked = !!state.settings.showItemsExpanded;
      var elKpi = document.getElementById('settingShowKpiCards');
      if (elKpi) elKpi.checked = !!state.settings.showKpiCards;
      var elBan = document.getElementById('settingShowSyncBanner');
      if (elBan) elBan.checked = !!state.settings.showSyncBanner;
      var elAutoDel = document.getElementById('settingAutoDeleteOnReceive');
      if (elAutoDel) elAutoDel.checked = !!state.settings.autoDeleteOnReceive;
      var elSort = document.getElementById('selectHomeSortOrder');
      if (elSort) elSort.value = state.settings.sortOrder || 'CUSTOM';

      document.querySelectorAll('.layout-mode-btn').forEach(function(btn) {
        var mode = btn.getAttribute('data-layout-mode');
        if (mode === state.settings.layoutMode) {
          btn.className = 'layout-mode-btn py-1.5 px-2 rounded-xl font-extrabold bg-emerald-600 text-white';
        } else {
          btn.className = 'layout-mode-btn py-1.5 px-2 rounded-xl font-bold bg-slate-800 text-slate-300 border border-slate-700';
        }
      });

      document.querySelectorAll('.font-scale-btn').forEach(function(btn) {
        var sc = parseFloat(btn.getAttribute('data-font-scale'));
        if (Math.abs(sc - (state.settings.fontScale || 1)) < 0.02) {
          btn.className = 'font-scale-btn py-2 rounded-xl font-extrabold bg-emerald-600 text-white';
        } else {
          btn.className = 'font-scale-btn py-2 rounded-xl font-bold bg-slate-800 text-slate-200 border border-slate-600';
        }
      });
    }

    function saveSettings() {
